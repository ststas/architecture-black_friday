name: mongo-sharding

services:
  configsvr:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --configsvr --replSet config-rs --port 27019 --bind_ip_all
    volumes:
      - configsvr_data:/data/db

  shard1:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard1-rs --port 27018 --bind_ip_all
    volumes:
      - shard1_data:/data/db

  shard2:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongod --shardsvr --replSet shard2-rs --port 27018 --bind_ip_all
    volumes:
      - shard2_data:/data/db

  mongos:
    image: dh-mirror.gitverse.ru/mongo:latest
    command: mongos --configdb config-rs/configsvr:27019 --port 27017 --bind_ip_all
    depends_on:
      - configsvr
      - shard1
      - shard2
    restart: on-failure

  pymongo_api:
    build: 
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos:27017"
      MONGODB_DATABASE_NAME: "somedb"


volumes:
  configsvr_data:
  shard1_data:
  shard2_data:
